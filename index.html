<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Meme Matter</title>
<meta name="description" content="Every meme is made of the same dust, the chain just rearranges it" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#1f1a14; --cream:#fbf5e6; --lime:#b6e83c; --pink:#ff5fa8; --night:#0b1512; --dim:#8a7a66;
  --disp:"Bungee",system-ui,sans-serif; --mono:"Space Mono",ui-monospace,monospace;
  --pad:clamp(14px,2.6vw,34px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,canvas{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.key{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font-family:var(--disp);font-size:12px;letter-spacing:.06em;background:var(--cream);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .14s,box-shadow .14s}
.key:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.key.lime{background:var(--lime)}
.key.pink{background:var(--pink)}
.key svg{width:14px;height:14px}
.key img{width:24px;height:24px;border:2px solid var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.gl{position:fixed;inset:0;z-index:0;background:var(--night)}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.4;mix-blend-mode:multiply}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(11,21,18,.85) 100%)}

.hud{position:fixed;z-index:9}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad);display:flex;gap:8px}
.name{position:fixed;left:var(--pad);bottom:var(--pad);z-index:9;font-family:var(--disp);font-size:clamp(24px,3.6vw,50px);line-height:.95;color:var(--cream);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);pointer-events:none;transition:opacity .3s,transform .3s}
.name em{font-style:normal;color:var(--lime)}
.name.off{opacity:0;transform:translateY(8px)}
.dots{position:fixed;right:var(--pad);bottom:var(--pad);z-index:9;display:flex;gap:6px}
.dots i{width:12px;height:12px;background:var(--cream);border:2px solid var(--ink)}
.dots i.on{background:var(--lime)}

.runway{position:relative;z-index:1;height:500svh;pointer-events:none}

.panel{position:relative;z-index:2;background:rgba(11,21,18,.55);backdrop-filter:blur(6px);border-top:2px solid var(--lime);padding:clamp(28px,5vw,60px) var(--pad)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(900px,100%);margin:0 auto}
.tile{background:rgba(11,21,18,.7);border:2px solid var(--lime);box-shadow:4px 4px 0 var(--ink);padding:12px 8px 10px;text-align:center;color:var(--cream);transition:transform .14s,box-shadow .14s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:rgba(11,21,18,.9)}
.tile img{width:60%;aspect-ratio:1;object-fit:contain;margin:0 auto 8px;filter:invert(1) sepia(1) saturate(4) hue-rotate(50deg) brightness(1.1);mix-blend-mode:screen}
.tile b{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.04em}
.sign{width:min(600px,100%);margin:clamp(24px,4vw,44px) auto 0;background:rgba(11,21,18,.75);border:2px solid var(--lime);box-shadow:6px 6px 0 var(--ink);padding:16px;display:grid;gap:12px;justify-items:center}
.ca{display:grid;justify-items:center;gap:8px;width:100%;padding:14px 16px;background:#050908;border:2px solid rgba(182,232,60,.35);color:var(--cream);cursor:pointer}
.ca .tag{font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--pink)}
.ca .ca-val{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--lime);white-space:nowrap;max-width:100%;line-height:1.2}
.ca.live .ca-val{font-size:clamp(10px,2.4vw,15px);letter-spacing:.02em}
.ca .cp{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--cream);padding:6px 12px;border:2px dashed rgba(251,245,230,.5)}
.ca.live{box-shadow:0 0 0 3px var(--lime),0 0 30px rgba(182,232,60,.55)}
.ca.live .cp{border-style:solid;border-color:var(--lime);color:var(--lime)}
.sign .btns{justify-content:center}
.end{width:min(1120px,100%);margin:24px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--disp);font-size:9px;letter-spacing:.08em;color:var(--cream);opacity:.7}

@media (max-width:820px){
  .tr .key span{display:none}
  .tr .key{padding:0 11px}
  .tl .key span{display:none}
  .name{font-size:24px;bottom:calc(var(--pad) + 26px)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .ca .ca-val{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<canvas class="gl" id="gl"></canvas>
<div class="scan"></div><div class="vig"></div>

<a class="hud tl key" href="/"><img src="assets/favicon.png" alt="" /><span data-name>MEME MATTER</span></a>
<nav class="hud tr">
  <a class="key lime" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>BUY</span><svg><use href="#i-pons"/></svg></a>
  <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
  <a class="key pink" href="/docs"><span>DOCS</span></a>
</nav>
<div class="name" id="name">DOGE</div>
<div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>

<div class="runway"></div>

<section class="panel" id="panel">
  <div class="tiles">
    <div class="tile"><img src="assets/mask-doge.png" alt="" /><b>Doge</b></div>
    <div class="tile"><img src="assets/mask-pepe.png" alt="" /><b>Pepe</b></div>
    <div class="tile"><img src="assets/mask-wojak.png" alt="" /><b>Wojak</b></div>
    <div class="tile"><img src="assets/mask-troll.png" alt="" /><b>Troll</b></div>
  </div>
  <div class="sign">
    <div class="ca" id="ca"><span class="tag">CONTRACT</span><b class="ca-val" id="caVal">soon</b><button class="cp" id="caCopy">[ COPY ]</button></div>
    <div class="btns">
      <a class="key lime" data-link="pons" href="https://www.ponsfamily.com/launchpad">BUY ON PONS<svg><use href="#i-pons"/></svg></a>
      <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
      <a class="key pink" href="/docs">DOCS</a>
    </div>
  </div>
  <div class="end"><span data-name>MEME MATTER</span><span>ROBINHOOD CHAIN · PONS</span></div>
</section>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pons" viewBox="0 0 64 64"><path d="M14 8h24c11 0 18 7 18 17s-7 17-18 17h-9v12a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M29 20h8c4 0 6.5 2 6.5 5s-2.5 5-6.5 5h-8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></symbol>
</svg>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS_CA = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME.toUpperCase(); });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS_CA ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });
  var caBox = document.getElementById('ca'), caVal = document.getElementById('caVal'), caCopy = document.getElementById('caCopy');
  caVal.textContent = HAS_CA ? CA : 'soon';
  if(HAS_CA){ caBox.classList.add('live'); caBox.title = CA; }
  caBox.addEventListener('click', function(){ var old = caCopy.textContent; if(HAS_CA){ if(navigator.clipboard) navigator.clipboard.writeText(CA); caCopy.textContent = '[ COPIED ]'; } else { caCopy.textContent = '[ NOT YET ]'; } setTimeout(function(){ caCopy.textContent = old; }, 1400); });

  var bgm = document.getElementById('bgm'), armed = false, hasMusic = true;
  bgm.addEventListener('error', function(){ hasMusic = false; });
  function arm(){ if(armed) return; armed = true; if(hasMusic){ bgm.volume = .3; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  /* ================= particles ================= */
  var cv = document.getElementById('gl'), gl = cv.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });
  var mobile = innerWidth < 820, N = mobile ? 9000 : 22000, DPR = Math.min(2, devicePixelRatio || 1);
  var pos = new Float32Array(N * 2), vel = new Float32Array(N * 2), tgt = new Float32Array(N * 2), col = new Float32Array(N * 3), seed = new Float32Array(N);
  var W = 0, H = 0;
  function resize(){ W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; gl.viewport(0, 0, cv.width, cv.height); }
  resize(); addEventListener('resize', function(){ resize(); rebuild(); });

  var vs = 'attribute vec2 p;attribute vec3 c;uniform vec2 r;uniform float s;varying vec3 vc;void main(){vec2 z=p/r*2.0-1.0;gl_Position=vec4(z.x,-z.y,0.0,1.0);gl_PointSize=s;vc=c;}';
  var fs = 'precision mediump float;varying vec3 vc;void main(){vec2 d=gl_PointCoord-0.5;float a=1.0-smoothstep(0.25,0.5,length(d));gl_FragColor=vec4(vc*a,a);}';
  function sh(t, src){ var s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  var aP = gl.getAttribLocation(prog, 'p'), aC = gl.getAttribLocation(prog, 'c'), uR = gl.getUniformLocation(prog, 'r'), uS = gl.getUniformLocation(prog, 's');
  var bP = gl.createBuffer(), bC = gl.createBuffer();
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  /* shapes: sample dark pixels from masks, plus the ticker as text */
  var shapes = [], names = ['DOGE', 'PEPE', 'WOJAK', 'TROLL', S.TICKER], loaded = 0, srcs = ['doge', 'pepe', 'wojak', 'troll'];
  var off = document.createElement('canvas'), oc = off.getContext('2d', { willReadFrequently: true });
  function sampleCanvas(w, h, draw){ off.width = w; off.height = h; oc.clearRect(0, 0, w, h); draw(oc); var d = oc.getImageData(0, 0, w, h).data, pts = []; for(var y = 0; y < h; y++) for(var x = 0; x < w; x++){ var i = (y * w + x) * 4; if(d[i + 3] > 40 && d[i] < 100) pts.push(x / w, y / h); } return pts; }
  srcs.forEach(function(n, i){ var im = new Image(); im.onload = function(){ shapes[i] = sampleCanvas(220, 220, function(c){ c.fillStyle = '#fff'; c.fillRect(0, 0, 220, 220); c.drawImage(im, 0, 0, 220, 220); }); loaded++; if(loaded === 4) rebuild(); }; im.src = 'assets/mask-' + n + '.png'; });
  function textShape(){ var w = 900, h = 260; return sampleCanvas(w, h, function(c){ c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.fillStyle = '#000'; c.font = '700 ' + (mobile ? 150 : 190) + 'px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(S.TICKER, w / 2, h / 2 + 8); }); }
  var cur = -1, mouse = { x: -9999, y: -9999 };
  function setTargets(k){
    var pts = k === 4 ? textShape() : shapes[k]; if(!pts || !pts.length) return;
    var n = pts.length / 2, size = k === 4 ? Math.min(W * .92, 1100) : Math.min(W, H) * .78, ar = k === 4 ? 260 / 900 : 1, cx = W / 2, cy = H / 2 - (mobile ? 20 : 0);
    for(var i = 0; i < N; i++){ var j = ((i * 7919) % n) * 2; var jx = (Math.random() - .5) * 3, jy = (Math.random() - .5) * 3; tgt[i * 2] = cx + (pts[j] - .5) * size + jx; tgt[i * 2 + 1] = cy + (pts[j + 1] - .5) * size * ar + jy; }
    var pal = [[.71, .91, .24], [.55, .85, .2], [.98, .96, .9], [1, .37, .66]];
    for(var q = 0; q < N; q++){ var c = k === 4 ? pal[q % 3] : pal[q % 2 === 0 ? 0 : 1]; if(k === 3 && q % 5 === 0) c = pal[3]; col[q * 3] = c[0]; col[q * 3 + 1] = c[1]; col[q * 3 + 2] = c[2]; }
    gl.bindBuffer(gl.ARRAY_BUFFER, bC); gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  }
  function rebuild(){ for(var i = 0; i < N; i++){ seed[i] = Math.random() * 6.28; if(cur < 0){ pos[i * 2] = Math.random() * W; pos[i * 2 + 1] = Math.random() * H; } } var k = shapeAt(); cur = -1; go(k); }
  function shapeAt(){ var p = (window.scrollY || 0) / Math.max(1, document.querySelector('.runway').offsetHeight - innerHeight); return Math.max(0, Math.min(4, Math.round(p * 4))); }
  var nameEl = document.getElementById('name'), dots = [].slice.call(document.querySelectorAll('.dots i'));
  function go(k){ if(k === cur) return; cur = k; setTargets(k); for(var i = 0; i < N; i++){ vel[i * 2] += (Math.random() - .5) * 14; vel[i * 2 + 1] += (Math.random() - .5) * 14; } nameEl.classList.add('off'); setTimeout(function(){ nameEl.innerHTML = k === 4 ? '<em>' + names[4] + '</em>' : names[k]; nameEl.classList.remove('off'); }, 200); dots.forEach(function(d, i){ d.classList.toggle('on', i === k); }); }
  addEventListener('scroll', function(){ if(loaded === 4) go(shapeAt()); }, { passive: true });
  addEventListener('pointermove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; }); addEventListener('pointerleave', function(){ mouse.x = -9999; });
  addEventListener('touchmove', function(e){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, { passive: true }); addEventListener('touchend', function(){ mouse.x = -9999; });

  var t = 0, R = mobile ? 80 : 130, R2 = R * R;
  function frame(){
    t += .016;
    for(var i = 0; i < N; i++){
      var ix = i * 2, iy = ix + 1, x = pos[ix], y = pos[iy];
      var dx = tgt[ix] - x, dy = tgt[iy] - y;
      var ax = dx * .045, ay = dy * .045;
      var mx = x - mouse.x, my = y - mouse.y, d2 = mx * mx + my * my;
      if(d2 < R2){ var d = Math.sqrt(d2) + .01, f = (R - d) / R * 9; ax += mx / d * f; ay += my / d * f; }
      var s = seed[i]; ax += Math.sin(t * 1.7 + s) * .12; ay += Math.cos(t * 1.3 + s * 1.7) * .12;
      vel[ix] = (vel[ix] + ax) * .84; vel[iy] = (vel[iy] + ay) * .84;
      pos[ix] = x + vel[ix]; pos[iy] = y + vel[iy];
    }
    gl.clearColor(.043, .082, .07, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindBuffer(gl.ARRAY_BUFFER, bP); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bC); gl.enableVertexAttribArray(aC); gl.vertexAttribPointer(aC, 3, gl.FLOAT, false, 0, 0);
    gl.uniform2f(uR, W, H); gl.uniform1f(uS, (mobile ? 2.2 : 2.6) * DPR);
    gl.drawArrays(gl.POINTS, 0, N);
    requestAnimationFrame(frame);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, bC); gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  for(var i = 0; i < N; i++){ pos[i * 2] = Math.random() * W; pos[i * 2 + 1] = Math.random() * H; tgt[i * 2] = pos[i * 2]; tgt[i * 2 + 1] = pos[i * 2 + 1]; col[i * 3] = .71; col[i * 3 + 1] = .91; col[i * 3 + 2] = .24; }
  requestAnimationFrame(frame);
  window.__mm = { go: go, cur: function(){ return cur; }, n: N };
})();
</script>
</body>
</html>
